<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#22272a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="为 iPad 与 Apple Pencil 设计的中文像素画室。绘画、图层、逐帧动画和 Aseprite 文件。"><title>像素画室 · Pixel Studio</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="topbar"><div class="top-left"><button id="gallery" class="text-button" aria-label="打开作品库"><span class="brand-mark">▦</span> 作品库</button><span class="divider"></span><button data-panel="settings" aria-label="画室设置" title="画室设置"></button><button data-panel="brush" aria-label="笔刷设置" title="笔刷设置"></button><button id="brush-size" class="size-button" data-panel="brush" aria-label="调整笔刷大小">1 px</button></div><button id="title-button" class="title-button" aria-label="重命名作品"><strong id="project-name">像素画室</strong><span id="project-detail">160 × 112 · 第 1 帧</span></button><div class="top-right"><span id="save-status" class="save-status">本地画室</span><button data-panel="export" aria-label="保存与导出" title="保存与导出"></button><button id="fit" aria-label="画布适应窗口" title="适应窗口"></button><button data-panel="layers" aria-label="图层面板" title="图层面板"></button><button id="timeline-toggle" aria-label="显示或隐藏时间轴" title="动画时间轴"></button></div></header>
<main id="stage" aria-label="绘画区域"><canvas id="view" aria-label="像素画布"></canvas><div class="canvas-label"><span class="live-dot"></span><span id="canvas-info">像素画布</span></div><div class="tools" id="tools" role="toolbar" aria-label="绘画工具"></div><div class="view-controls"><button id="zoom-out" aria-label="缩小画布">−</button><button id="zoom-label" aria-label="重置画布视角">400%</button><button id="zoom-in" aria-label="放大画布">＋</button><span></span><button id="rotate" aria-label="顺时针旋转画布">↻</button><button id="grid" aria-label="像素网格" aria-pressed="false">▦</button></div><div id="floatbar" class="floatbar"><span id="float-drag" aria-label="拖动浮动工具栏" title="拖动工具栏">⠿</span><button id="quick-undo" aria-label="撤销"></button><button id="quick-redo" aria-label="重做"></button><i></i><button id="pencil-only" aria-label="仅触控笔绘画" aria-pressed="false"></button><span id="input-mode">笔与手指</span></div><div class="welcome-hint" id="welcome-hint">双指拖动画布与缩放 · 双指轻点撤销 · 三指轻点重做<button id="dismiss-hint" aria-label="关闭操作提示">×</button></div></main>
<footer id="timeline"><div class="timeline-top"><div class="animation-caption"><span class="section-kicker">动画</span><span id="frame-count">06 FRAMES</span></div><div class="playback"><button id="first" aria-label="第一帧"></button><button id="prev" aria-label="上一帧"></button><button id="play" aria-label="播放动画"></button><button id="next" aria-label="下一帧"></button><button id="last" aria-label="最后一帧"></button></div><div class="frame-actions"><button id="onion" aria-label="洋葱皮" title="洋葱皮" aria-pressed="false"></button><button id="duplicate-frame" aria-label="复制当前帧" title="复制当前帧"></button><button id="add-frame" aria-label="添加空白帧" title="添加空白帧"></button><button data-panel="animation" aria-label="动画设置" title="动画设置"></button></div></div><div id="frames" class="frames" aria-label="动画帧"></div></footer>
<aside id="panel" hidden aria-label="工具设置"><div class="panel-head"><h2 id="panel-title"></h2><button id="close-panel" aria-label="关闭面板">×</button></div><div id="panel-content"></div></aside>
<dialog id="gallery-dialog"><div class="gallery-head"><div><span class="section-kicker">PIXEL STUDIO</span><h1>你的像素画室</h1><p>从一颗像素开始，把想象画成小世界。</p></div><button id="close-gallery" aria-label="返回画布">×</button></div><div class="gallery-actions"><button id="new-project" class="primary">＋ 新建画布</button><button id="import-button">导入文件</button><button id="new-demo">打开霓虹练习</button></div><div id="gallery-list" class="gallery-list"></div><p class="gallery-note">作品保存在这个浏览器中。换设备前，请导出项目或 Aseprite 文件备份。</p></dialog>
<dialog id="new-dialog"><form id="new-form"><span class="section-kicker">NEW CANVAS</span><h2>一张新画布</h2><label>作品名称<input name="name" value="新的像素作品" maxlength="160" required></label><div class="dimension-inputs"><label>宽度<input name="width" type="number" min="1" max="512" value="64" required></label><span>×</span><label>高度<input name="height" type="number" min="1" max="512" value="64" required></label></div><div class="presets"><button type="button" data-size="32">32 × 32</button><button type="button" data-size="64">64 × 64</button><button type="button" data-size="128">128 × 128</button></div><div class="dialog-actions"><button type="button" id="cancel-new">取消</button><button type="submit" class="primary">创建画布</button></div></form></dialog>
<input id="file-input" type="file" accept=".pixel,.json,.ase,.aseprite,.png,.jpg,.jpeg,.webp" hidden><div id="toast" role="status" hidden></div><script type="module" src="./app.js"></script>
</body></html>
